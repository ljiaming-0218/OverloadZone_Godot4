<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>过载禁区 OVERLOAD ZONE — 可玩原型</title>
<style>
:root{color-scheme:dark;--cyan:#78eafb;--green:#6ff1cc;--muted:#95a8bd}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#060b15;color:#eaf9ff;font:16px/1.5 'Microsoft YaHei',Inter,system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:18px}
#wrapper{width:min(1320px,100%);}
#top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:20px}
.brand{font-size:18px;letter-spacing:.16em;font-weight:900;color:#96edff}.version{color:#7796a8;font-size:12px}.help{color:#9baec2;font-size:13px}kbd{font:inherit;background:#172537;color:#d5f3fe;padding:3px 7px;border-radius:5px;border:1px solid #365269}
#stage{width:100%;position:relative;aspect-ratio:16/9;border:1px solid #2a5870;box-shadow:0 15px 70px #0009,inset 0 0 70px #30d3fc11;overflow:hidden;border-radius:14px;background:#0a1425}
canvas{width:100%;height:100%;display:block;cursor:crosshair}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#06101ee8;backdrop-filter:blur(8px);padding:18px;overflow-y:auto}
#overlay.hidden{display:none}
.panel{width:min(620px,94%);border:1px solid #4b97b8;background:linear-gradient(160deg,#10293c,#07111d);border-radius:20px;padding:35px 36px 32px;box-shadow:0 16px 60px #000a;position:relative}
.panel:before{content:"";position:absolute;inset:-2px;border-radius:20px;pointer-events:none;box-shadow:0 0 80px #1594b025}
.eyebrow{color:#80e4e6;font-size:13px;letter-spacing:.32em;font-weight:700;text-align:center}
h1{font-size:clamp(34px,5vw,54px);margin:7px 0 8px;text-align:center;letter-spacing:.14em;line-height:1.15;text-shadow:0 0 26px #24b2c06b}.sub{text-align:center;color:#a0b9cb;margin:0 0 18px}.rules{font-size:15px;background:#092136;border:1px solid #1f4c66;border-radius:11px;padding:15px 18px;margin:20px 0;color:#c9e2ee;line-height:2.05}.rules strong{color:#9bf3cc}
button{font:inherit;cursor:pointer;transition:background .12s,border-color .12s,transform .12s}button:hover{transform:translateY(-2px)}.mainbtn{width:100%;border:1px solid #64efc8;color:#071d23;background:linear-gradient(100deg,#7eeecd,#82e5fd);border-radius:11px;padding:15px;font-weight:900;font-size:19px}.mainbtn:hover{background:#aeffe8}.choices{display:grid;gap:10px;margin:18px 0}.choice{width:100%;text-align:left;background:#172f43;border:1px solid #5590ae;color:#f4fbff;border-radius:10px;padding:12px 16px;font-size:16px}.choice strong{font-size:18px}.choice small{color:#afc6d7;display:block;margin-top:2px;font-size:13px}.choice:nth-child(2){border-color:#a57be0}.choice:nth-child(3){border-color:#e4af6a}.micro{font-size:12px;color:#637f93;margin-top:12px;text-align:center}
#foot{display:flex;justify-content:space-between;gap:20px;margin-top:12px;color:#637f93;font-size:12px;flex-wrap:wrap}#foot b{color:#a1dadd}
@media(max-width:780px){body{padding:8px}#top{display:block}.help{display:none}#stage{border-radius:6px}.panel{padding:20px}.rules{line-height:1.6}#foot{font-size:11px}}
</style>
</head>
<body><div id="wrapper"><div id="top"><div><span class="brand">OVERLOAD ZONE</span><span class="version"> &nbsp; / &nbsp; v0.1 PLAYABLE</span></div><div class="help"><kbd>WASD</kbd> 移动 &nbsp; <kbd>Space</kbd> 冲刺吸弹 &nbsp; <kbd>Q</kbd> 过载 &nbsp; 自动射击 · 可按住左键手动瞄准</div></div>
<div id="stage"><canvas id="c" width="1280" height="720" aria-label="过载禁区游戏画面"></canvas><div id="overlay"><div class="panel" id="panel"></div></div></div>
<div id="foot"><span>完全离线运行 · 无需账号 / 插件 / GPU 模型 · 推荐使用电脑键鼠</span><span>正式开发版：同目录 <b>Godot 4 工程</b></span></div></div>
<script>
'use strict';
const c=document.querySelector('#c'),ctx=c.getContext('2d'),stage=document.querySelector('#stage'),overlay=document.querySelector('#overlay'),panel=document.querySelector('#panel');
const W=1280,H=720,TAU=Math.PI*2,keys=new Set(),mouse={x:640,y:360,held:false};
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x)),rand=(a,b)=>a+Math.random()*(b-a),dist2=(a,b)=>{const x=a.x-b.x,y=a.y-b.y;return x*x+y*y},norm=(x,y)=>{let d=Math.hypot(x,y)||1;return{x:x/d,y:y/d}},rgba=(hex,a)=>{let n=parseInt(hex.replace('#',''),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
const upgrades=[
{id:'rapid',name:'超频扳机',tag:'火力',desc:'射速 +25%'},{id:'multi',name:'双生弹幕',tag:'火力',desc:'每次多发射一颗散射弹'},{id:'damage',name:'钨芯弹头',tag:'火力',desc:'全部枪械伤害 +30%'},{id:'pierce',name:'穿甲弹',tag:'火力',desc:'子弹穿透次数 +1'},
{id:'chain',name:'死亡电弧',tag:'连锁',desc:'击杀时向附近敌人弹射闪电'},{id:'bomb',name:'死亡爆破',tag:'连锁',desc:'击杀后爆炸，可连续传染'},{id:'recycler',name:'能量回收',tag:'过载',desc:'每次吸收子弹能量 +40%'},{id:'blast',name:'过载增幅',tag:'过载',desc:'爆炸范围 +30%、伤害 +20%'},{id:'capacitor',name:'击杀充能',tag:'过载',desc:'击杀恢复额外的过载能量'},{id:'dash',name:'瞬移核心',tag:'机动',desc:'冲刺冷却 -18%、距离 +12%'},{id:'magnet',name:'拾荒磁场',tag:'生存',desc:'经验吸附半径 +110'},{id:'armor',name:'纳米装甲',tag:'生存',desc:'生命上限 +20，立刻治疗 20'},{id:'orbit',name:'电刃环绕',tag:'连锁',desc:'获得不断攻击怪群的旋转电刃'},{id:'vamp',name:'猎杀修复',tag:'生存',desc:'每 15 次击杀恢复 8 点生命'}
];
let G, state='menu',last=0,audio=null,choiceSet=[],shake=0,flash=0;
function reset(){G={t:0,kills:0,lvl:1,xp:0,need:6,hp:100,maxhp:100,energy:50,px:0,py:0,aim:0,moveX:0,moveY:0,inv:0,dash:0,dashTime:0,dx:0,dy:0,shoot:0,spawn:.6,orbitTick:0,boss:false,uid:0,up:Object.fromEntries(upgrades.map(u=>[u.id,0])),enemies:[],shots:[],hostile:[],gems:[],fx:[],rings:[],beams:[],floaters:[],notice:'',noticeT:0,chainBudget:12};shake=flash=0;}
function sound(kind){try{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)()}if(audio.state==='suspended')audio.resume();const t=audio.currentTime,os=audio.createOscillator(),gain=audio.createGain(),filter=audio.createBiquadFilter();let a=500,b=120,sec=.13,vol=.035,wave='sawtooth';if(kind==='shoot'){a=750;b=310;sec=.06;vol=.016}else if(kind==='collect'){a=480;b=1250;sec=.12;wave='sine';vol=.017}else if(kind==='dash'){a=1000;b=160;sec=.16;vol=.032}else if(kind==='boom'){a=160;b=42;sec=.52;vol=.09}else if(kind==='level'){a=380;b=860;sec=.45;vol=.06;wave='triangle'}else if(kind==='hurt'){a=280;b=74;sec=.23;vol=.06}os.type=wave;os.frequency.setValueAtTime(a,t);os.frequency.exponentialRampToValueAtTime(b,t+sec);filter.type='lowpass';filter.frequency.value=2200;gain.gain.setValueAtTime(vol,t);gain.gain.exponentialRampToValueAtTime(.0001,t+sec);os.connect(filter);filter.connect(gain);gain.connect(audio.destination);os.start(t);os.stop(t+sec+.01)}catch(e){}}
function menu(title,subtitle,body,button,fn){state='paused';overlay.classList.remove('hidden');panel.innerHTML=`<div class="eyebrow">ROGUELITE ACTION · VERTICAL SLICE</div><h1>${title}</h1><p class="sub">${subtitle}</p><div class="rules">${body}</div><button class="mainbtn" id="action">${button}</button><div class="micro">本版本约 3 分钟 · 2:00 刷新 Boss · 无外部素材与网络依赖</div>`;panel.querySelector('#action').onclick=fn}
function intro(){menu('过 载 禁 区','OVERLOAD ZONE · 弹幕反击动作肉鸽','<strong>WASD / 方向键</strong> 移动，武器自动寻找最近的敌人射击。<br><strong>SPACE</strong> 冲刺：穿过红色敌弹可将其转化成能量。<br><strong>Q</strong> 过载：能量满时释放毁灭性冲击波。<br>收集绿色晶体升级，尝试“闪电 + 死亡爆破”组合。','▶ 开始试炼',()=>{reset();state='playing';overlay.classList.add('hidden');sound('level')})}
function addFx(x,y,color,count=8,power=180){for(let i=0;i<count&&G.fx.length<650;i++){const a=rand(0,TAU),sp=rand(power*.16,power);G.fx.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:rand(.20,.58),max:.58,color,size:rand(2,5)})}}
function ring(x,y,r,color,d=.3){G.rings.push({x,y,r,t:d,max:d,color})}
function text(x,y,label,color='#ffeea6'){if(G.floaters.length<70)G.floaters.push({x,y,label,color,t:.65})}
function notice(s,d=2){G.notice=s;G.noticeT=d}
function spawn(type,x,y){const spec={runner:[32,129,17],shooter:[52,72,20],brute:[140,56,30],boss:[1200,44,70]}[type];G.enemies.push({id:++G.uid,type,x,y,hp:spec[0],max:spec[0],speed:spec[1],r:spec[2],fire:rand(.4,1.8),hurt:0,live:true,spin:rand(0,TAU)})}
function hurtEnemy(e,damage){if(!e.live)return;e.hp-=damage;e.hurt=.13;if(damage>35&&Math.random()<.35)text(e.x,e.y-20,Math.round(damage));if(e.hp<=0){e.live=false;kill(e)}}
function kill(e){G.kills++;addFx(e.x,e.y,e.type==='boss'?'#bd84ff':'#ffba77',e.type==='boss'?70:12,e.type==='boss'?420:240);ring(e.x,e.y,e.type==='boss'?170:42,e.type==='boss'?'#bb88ff':'#fd8c9a',e.type==='boss'?.7:.28);if(e.type==='boss'){end(true);return}if(G.gems.length<270)G.gems.push({x:e.x,y:e.y,value:e.type==='brute'?3:e.type==='shooter'?2:1,spin:0});if(G.up.capacitor)G.energy=clamp(G.energy+G.up.capacitor*1.8,0,100);if(G.up.vamp&&G.kills%15===0){G.hp=Math.min(G.maxhp,G.hp+8);text(G.px,G.py-42,'+8 HP','#9dffc3')}
if(G.chainBudget>0&&G.up.bomb){G.chainBudget--;let r=80+G.up.bomb*20;ring(e.x,e.y,r,'#ffb86b');for(const other of G.enemies){if(other.live&&Math.hypot(other.x-e.x,other.y-e.y)<r+other.r)hurtEnemy(other,18+14*G.up.bomb)}}
if(G.chainBudget>0&&G.up.chain){G.chainBudget--;let list=G.enemies.filter(n=>n.live&&dist2(n,e)<220**2).sort((a,b)=>dist2(a,e)-dist2(b,e));for(const other of list.slice(0,1+G.up.chain)){G.beams.push({x:e.x,y:e.y,xx:other.x,yy:other.y,t:.15});hurtEnemy(other,20+12*G.up.chain)}}}
function fireShot(){let count=1+G.up.multi;for(let i=0;i<count;i++){let a=G.aim+(i-(count-1)/2)*.15+rand(-.02,.02);G.shots.push({x:G.px+Math.cos(a)*26,y:G.py+Math.sin(a)*26,vx:Math.cos(a)*970,vy:Math.sin(a)*970,t:1.12,pierce:G.up.pierce,hit:new Set(),damage:24*(1+.3*G.up.damage)})}sound('shoot')}
function absorb(b){b.live=false;G.energy=clamp(G.energy+8*(1+.4*G.up.recycler),0,100);addFx(b.x,b.y,'#80fcff',7,135);ring(b.x,b.y,32,'#82f5fd',.15);sound('collect');if(G.energy>=99.99)notice('过载已就绪！按 Q 清场',1.5)}
function dash(){if(G.dash>0||G.dashTime>0)return;let n=norm(G.moveX,G.moveY);if(!G.moveX&&!G.moveY)n={x:Math.cos(G.aim),y:Math.sin(G.aim)};G.dx=n.x;G.dy=n.y;G.dashTime=.19;G.dash=1.45*.82**G.up.dash;G.inv=Math.max(G.inv,.22);shake=4;addFx(G.px,G.py,'#70eaff',15,210);sound('dash')}
function overload(){if(G.energy<99.99)return;G.energy=0;let radius=285*(1+.3*G.up.blast),damage=110*(1+.2*G.up.blast);ring(G.px,G.py,radius,'#85e9ff',.58);ring(G.px,G.py,radius*.80,'#b6a4ff',.48);addFx(G.px,G.py,'#84ebff',80,560);shake=16;flash=.6;for(const e of G.enemies)if(e.live&&Math.hypot(e.x-G.px,e.y-G.py)<radius+e.r)hurtEnemy(e,damage);for(const b of G.hostile)if(b.live&&Math.hypot(b.x-G.px,b.y-G.py)<radius*1.2)b.live=false;notice('过 载 释 放 ！',1.4);sound('boom')}
function damagePlayer(d){if(G.inv>0)return;G.hp=Math.max(0,G.hp-d);G.inv=.8;flash=.24;shake=9;addFx(G.px,G.py,'#ff7285',9,200);text(G.px,G.py-33,`-${Math.round(d)}`,'#ff7085');sound('hurt');if(G.hp<=0)end(false)}
function chooseUp(){const opts=[...upgrades].sort(()=>Math.random()-.5).slice(0,3);choiceSet=opts;state='paused';overlay.classList.remove('hidden');panel.innerHTML=`<div class="eyebrow">LEVEL UP</div><h1>能力进化</h1><p class="sub">等级 ${G.lvl} · 选择一种进化方向（可叠加）</p><div class="choices">${opts.map((u,i)=>`<button class="choice" data-i="${i}"><strong>${i+1} · [${u.tag}] ${u.name}</strong><small>${u.desc}</small></button>`).join('')}</div><p class="micro">试着组合死亡电弧、死亡爆破、击杀充能形成连锁反应</p>`;panel.querySelectorAll('.choice').forEach(b=>b.onclick=()=>pick(Number(b.dataset.i)));sound('level')}
function pick(i){const u=choiceSet[i];if(!u)return;G.up[u.id]++;if(u.id==='armor'){G.maxhp+=20;G.hp=Math.min(G.maxhp,G.hp+20)}state='playing';overlay.classList.add('hidden');notice('已获得：'+u.name,1.7);if(G.xp>=G.need)levelUp()}
function levelUp(){if(state!=='playing'||G.xp<G.need)return;G.xp-=G.need;G.lvl++;G.need=6+G.lvl*4;G.hp=Math.min(G.maxhp,G.hp+4);chooseUp()}
function end(win){if(state!=='playing')return;menu(win?'核心已击破！':'试炼终止',`存活 ${Math.floor(G.t/60)}:${String(Math.floor(G.t%60)).padStart(2,'0')} · 击杀 ${G.kills} · 等级 ${G.lvl}`,`<strong>${win?'你让敌方弹幕变成了自己的武器。':'下一局可以尝试更激进地冲刺吸弹。'}</strong><br>体验另一套构筑：高攻速、死亡连锁、充能永动机。`,'↻ 再来一局',()=>{reset();state='playing';overlay.classList.add('hidden')})}
function update(dt){if(state!=='playing')return;dt=Math.min(dt,.045);G.t+=dt;G.chainBudget=14;G.inv=Math.max(0,G.inv-dt);G.dash=Math.max(0,G.dash-dt);G.dashTime=Math.max(0,G.dashTime-dt);G.shoot-=dt;G.spawn-=dt;G.orbitTick-=dt;G.noticeT=Math.max(0,G.noticeT-dt);shake=Math.max(0,shake-22*dt);flash=Math.max(0,flash-2.7*dt);
const dx=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft'));const dy=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));const n=norm(dx,dy);G.moveX=(dx||dy)?n.x:0;G.moveY=(dx||dy)?n.y:0;
let target=null,best=1e10;for(const e of G.enemies){if(!e.live)continue;let d=dist2(e,{x:G.px,y:G.py});if(d<best){best=d;target=e}}if(target)G.aim=Math.atan2(target.y-G.py,target.x-G.px);if(mouse.held){let mx=mouse.x-640,my=mouse.y-360;if(Math.hypot(mx,my)>22)G.aim=Math.atan2(my,mx)}
if(keys.has(' ')&&G.dash<=0)dash();if(keys.has('q')&&G.energy>=99.99)overload();
if(G.dashTime>0){G.px+=G.dx*790*(1+.12*G.up.dash)*dt;G.py+=G.dy*790*(1+.12*G.up.dash)*dt;if(Math.random()<.85)addFx(G.px,G.py,'#80efff',2,120)}else{G.px+=G.moveX*282*dt;G.py+=G.moveY*282*dt}G.px=clamp(G.px,-1480,1480);G.py=clamp(G.py,-1070,1070);
if(G.shoot<=0&&best<900**2){fireShot();G.shoot=.23/(1+.25*G.up.rapid)}
if(!G.boss&&G.t>=120){G.boss=true;spawn('boss',G.px,G.py-530);notice('⚠ 重 装 核 心 入 侵',3.0);sound('level')}
if(G.spawn<=0&&G.enemies.length<150){const p=clamp(G.t/120,0,1);G.spawn=(.61-.40*p)*rand(.82,1.18);let count=1+(G.t>50&&Math.random()<.32?1:0)+(G.t>95&&Math.random()<.3?1:0);for(let i=0;i<count;i++){let a=rand(0,TAU),r=rand(710,810),roll=Math.random(),type='runner';if(G.t>16&&roll<.28)type='shooter';else if(G.t>37&&roll<.43)type='brute';spawn(type,clamp(G.px+Math.cos(a)*r,-1460,1460),clamp(G.py+Math.sin(a)*r,-1060,1060))}}
for(const e of G.enemies){if(!e.live)continue;e.hurt=Math.max(0,e.hurt-dt);e.spin+=dt*2;e.fire-=dt;let nx=G.px-e.x,ny=G.py-e.y,d=Math.hypot(nx,ny)||1,move=e.type==='shooter'&&d<300?-.27:e.type==='boss'&&d<220?-.16:1;e.x+=nx/d*e.speed*dt*move;e.y+=ny/d*e.speed*dt*move;if(e.fire<=0&&d<710){if(e.type==='shooter'){hostileBullet(e.x,e.y,nx/d,ny/d,220,10);e.fire=rand(1.5,2.2)}else if(e.type==='boss'){for(let j=0;j<14;j++){let a=j*TAU/14+G.t*.33;hostileBullet(e.x,e.y,Math.cos(a),Math.sin(a),200,12)}for(let j=-2;j<=2;j++){let a=Math.atan2(ny,nx)+j*.14;hostileBullet(e.x,e.y,Math.cos(a),Math.sin(a),290,13)}e.fire=3.0}}if(d<e.r+18&&G.dashTime<=0)damagePlayer(e.type==='boss'?17:10)}
for(const b of G.shots){b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;for(const e of G.enemies){if(!e.live||b.t<=0||b.hit.has(e.id))continue;if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+5){b.hit.add(e.id);hurtEnemy(e,b.damage);addFx(b.x,b.y,'#ffbc81',4,165);b.pierce--;if(b.pierce<0)b.t=-1}}}
for(const b of G.hostile){if(!b.live)continue;b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;if(b.t<=0){b.live=false;continue}let d2=(b.x-G.px)**2+(b.y-G.py)**2;if(G.dashTime>0&&d2<78**2)absorb(b);else if(d2<(b.r+17)**2){b.live=false;damagePlayer(b.damage)}}
if(G.up.orbit&&G.orbitTick<=0){G.orbitTick=.14;for(let j=0;j<G.up.orbit+1;j++){let a=G.t*3.2+j*TAU/(G.up.orbit+1),x=G.px+Math.cos(a)*74,y=G.py+Math.sin(a)*74;for(const e of G.enemies)if(e.live&&Math.hypot(e.x-x,e.y-y)<e.r+14)hurtEnemy(e,13)}}
for(const g of G.gems){g.spin+=dt*3;let x=G.px-g.x,y=G.py-g.y,d=Math.hypot(x,y);if(d<140+110*G.up.magnet&&d>1){g.x+=x/d*(490-d*.6)*dt;g.y+=y/d*(490-d*.6)*dt}if(d<26){g.taken=true;G.xp+=g.value;if(Math.random()<.2)sound('collect')}}
G.enemies=G.enemies.filter(e=>e.live);G.shots=G.shots.filter(b=>b.t>0);G.hostile=G.hostile.filter(b=>b.live);G.gems=G.gems.filter(g=>!g.taken);
for(const p of G.fx){p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-3*dt;p.vy*=1-3*dt}G.fx=G.fx.filter(p=>p.t>0);
for(const r of G.rings)r.t-=dt;G.rings=G.rings.filter(r=>r.t>0);for(const b of G.beams)b.t-=dt;G.beams=G.beams.filter(b=>b.t>0);for(const f of G.floaters){f.t-=dt;f.y-=dt*40}G.floaters=G.floaters.filter(f=>f.t>0);
if(G.xp>=G.need)levelUp();if(G.t>=180&&state==='playing')end(false);
}
function hostileBullet(x,y,dx,dy,speed,damage){if(G.hostile.length>=450)return;G.hostile.push({x:x+dx*22,y:y+dy*22,vx:dx*speed,vy:dy*speed,r:damage>12?9:7,damage,t:5.6,live:true})}
function rect(x,y,w,h,color,border){ctx.fillStyle=color;ctx.fillRect(x,y,w,h);if(border){ctx.strokeStyle=border;ctx.strokeRect(x,y,w,h)}}
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,TAU);ctx.fill()}
function polygon(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(...points[0]);for(const p of points.slice(1))ctx.lineTo(...p);ctx.closePath();ctx.fill()}
function arc(x,y,r,color,width=3,a=0,b=TAU){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.arc(x,y,r,a,b);ctx.stroke()}
function label(txt,x,y,size,color='#e7f8ff',align='left',weight=600){ctx.fillStyle=color;ctx.font=`${weight} ${size}px 'Microsoft YaHei', system-ui, sans-serif`;ctx.textAlign=align;ctx.fillText(txt,x,y)}
function bar(x,y,w,h,value,color){rect(x,y,w,h,'#17293b');rect(x,y,w*clamp(value,0,1),h,color);ctx.strokeStyle='#53758a';ctx.lineWidth=1;ctx.strokeRect(x,y,w,h)}
function draw(){rect(0,0,W,H,'#081323');if(!G)return;ctx.save();ctx.translate(640-G.px+(Math.random()-.5)*shake*2,360-G.py+(Math.random()-.5)*shake*2);
rect(-1500,-1100,3000,2200,'#0b182b','#2a7996');ctx.strokeStyle='#193a5070';ctx.lineWidth=1;for(let x=-1500;x<=1500;x+=100){ctx.beginPath();ctx.moveTo(x,-1100);ctx.lineTo(x,1100);ctx.stroke()}for(let y=-1100;y<=1100;y+=100){ctx.beginPath();ctx.moveTo(-1500,y);ctx.lineTo(1500,y);ctx.stroke()}for(let x=-1200;x<=1200;x+=300)for(let y=-900;y<=900;y+=270){arc(x,y,32,'#28748726',1);circle(x,y,2,'#267c8c')}
for(const g of G.gems){circle(g.x,g.y,15,'#4affd020');let s=9+Math.sin(g.spin)*2;polygon([[g.x,g.y-s],[g.x+s*.75,g.y],[g.x,g.y+s],[g.x-s*.75,g.y]],g.value>1?'#c49eff':'#79ffd1')}
for(const e of G.enemies){let col={runner:'#fd6280',shooter:'#c68cff',brute:'#ffb260',boss:'#bf7dff'}[e.type];if(e.hurt>0)col='#fff';circle(e.x,e.y,e.r*1.45,rgba(col,.10));if(e.type==='runner'){let a=Math.atan2(G.py-e.y,G.px-e.x),r=e.r;polygon([[e.x+Math.cos(a)*r*1.3,e.y+Math.sin(a)*r*1.3],[e.x+Math.cos(a+2.35)*r,e.y+Math.sin(a+2.35)*r],[e.x+Math.cos(a-2.35)*r,e.y+Math.sin(a-2.35)*r]],col)}else if(e.type==='shooter'){polygon([[e.x,e.y-e.r],[e.x+e.r,e.y],[e.x,e.y+e.r],[e.x-e.r,e.y]],col);circle(e.x,e.y,5,'#261b3c')}else if(e.type==='brute'){rect(e.x-e.r,e.y-e.r,e.r*2,e.r*2,col);rect(e.x-e.r+8,e.y-e.r+8,e.r*2-16,e.r*2-16,'#512d3c')}else{circle(e.x,e.y,e.r,col);arc(e.x,e.y,e.r-12,'#fce8b4',7,e.spin,e.spin+4.4);circle(e.x,e.y,28,'#2c2145');circle(e.x,e.y,12,'#fff')}if(e.type!=='runner')bar(e.x-e.r*1.14,e.y-e.r-18,e.r*2.28,5,e.hp/e.max,col)}
for(const b of G.shots){let a=Math.atan2(b.vy,b.vx);ctx.strokeStyle='#ffecb6';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(b.x-Math.cos(a)*19,b.y-Math.sin(a)*19);ctx.lineTo(b.x+Math.cos(a)*8,b.y+Math.sin(a)*8);ctx.stroke();circle(b.x,b.y,4,'#fff')}
for(const b of G.hostile){circle(b.x,b.y,b.r*2.3,'#ff866925');circle(b.x,b.y,b.r,'#ff8873');circle(b.x,b.y,b.r*.45,'#fff0be')}
let px=G.px,py=G.py;circle(px,py,37,'#42d9ff22');if(G.energy>=99.99)arc(px,py,42,'#a3ffcb',3);if(G.dashTime>0)arc(px,py,50,'#93f4ff',5);let a=G.aim;polygon([[px+Math.cos(a)*26,py+Math.sin(a)*26],[px+Math.cos(a+2.35)*22,py+Math.sin(a+2.35)*22],[px-Math.cos(a)*8,py-Math.sin(a)*8],[px+Math.cos(a-2.35)*22,py+Math.sin(a-2.35)*22]],G.inv>0&&Math.floor(G.t*18)%2?'#fff':'#65dafe');circle(px,py,9,'#102337');circle(px,py,4,'#f6ffff');ctx.strokeStyle='#ffe7a5';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(px+Math.cos(a)*12,py+Math.sin(a)*12);ctx.lineTo(px+Math.cos(a)*32,py+Math.sin(a)*32);ctx.stroke();
for(let j=0;j<G.up.orbit+1&&G.up.orbit;j++){let a=G.t*3.2+j*TAU/(G.up.orbit+1),x=px+Math.cos(a)*74,y=py+Math.sin(a)*74;circle(x,y,20,'#59c9ff35');polygon([[x,y-20],[x+11,y],[x,y+20],[x-11,y]],'#81d8ff')}
for(const r of G.rings){let phase=1-r.t/r.max;arc(r.x,r.y,r.r*phase,rgba(r.color,(1-phase)*.88),5)}for(const b of G.beams){ctx.strokeStyle=rgba('#9be5ff',Math.max(0,b.t/.15));ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.xx,b.yy);ctx.stroke()}for(const p of G.fx)circle(p.x,p.y,p.size*p.t/p.max,rgba(p.color,clamp(p.t/p.max,0,1)));for(const f of G.floaters)label(f.label,f.x,f.y,20,rgba(f.color,f.t/.65),'center');ctx.restore();
// User interface always stays stable while the camera follows the player.
rect(18,16,367,130,'#081b2de8','#2d718a');label('OVERLOAD ZONE',34,44,21,'#92ebfc');label('生命',34,78,18,'#bcd3df');bar(110,63,244,15,G.hp/G.maxhp,'#ee6981');label('过载',34,108,18,'#bcd3df');bar(110,92,244,17,G.energy/100,G.energy>=99.99?'#e9ff83':'#5fe8cd');label(`HP ${Math.ceil(G.hp)}/${G.maxhp}`,111,134,13,'#bed5df');label(`${Math.floor(G.energy)}%`,344,134,15,'#b7ffe4','right');
rect(424,15,422,72,'#081b2de0','#254961');label(`试炼 ${String(Math.floor(G.t/60)).padStart(2,'0')}:${String(Math.floor(G.t%60)).padStart(2,'0')}`,441,46,24,'#f4fcff');label(`击杀 ${G.kills}`,648,46,23,'#ffe4a4');label(`LV. ${G.lvl}`,441,76,17,'#d3caef');bar(535,63,281,9,G.xp/G.need,'#ad84fe');
label(G.boss?'⚠ 核心已入侵':`核心来袭 ${String(Math.floor(Math.max(0,120-G.t)/60)).padStart(2,'0')}:${String(Math.floor(Math.max(0,120-G.t)%60)).padStart(2,'0')}`,935,47,19,G.boss?'#ffc798':'#bdd8e7');
rect(18,635,354,69,'#0a2235de','#254861');label('SPACE · 冲刺 / 吸弹',32,661,19,'#dbf7ff');label(G.dash>0?`冷却 ${G.dash.toFixed(1)} 秒`:'冲刺已就绪',32,688,16,G.dash?'#a9bac7':'#8eebd2');rect(392,635,376,69,'#0a2235de','#254861');label('Q · 过载爆发',410,661,19,'#f4f6ff');label(G.energy>=99.99?'能量已满 · 按 Q 清屏！':'吸收敌弹积蓄过载能量',410,688,16,G.energy>=99.99?'#e9ff8e':'#94b5cb');if(G.noticeT>0){ctx.shadowColor='#4cecff';ctx.shadowBlur=20;label(G.notice,640,177,28,rgba('#d6fbff',Math.min(1,G.noticeT/.28)),'center');ctx.shadowBlur=0}if(flash>0)rect(0,0,W,H,`rgba(255,72,91,${flash*.13})`)
}
function frame(ts){let dt=last?(ts-last)/1000:0;last=ts;update(dt);draw();requestAnimationFrame(frame)}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(state==='paused'&&choiceSet.length&&['1','2','3'].includes(k)&&panel.querySelector('.choices')){pick(Number(k)-1);return}keys.add(k)},{passive:false});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();mouse.held=false});function mouseUpdate(e){const r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height}c.addEventListener('pointermove',mouseUpdate);c.addEventListener('pointerdown',e=>{mouseUpdate(e);mouse.held=true});window.addEventListener('pointerup',()=>mouse.held=false);
reset();intro();requestAnimationFrame(frame);
</script></body></html>
