services:
  - type: web
    name: overload-zone
    runtime: static
    buildCommand: "echo 'Static HTML5 game: no build dependencies'"
    staticPublishPath: ./web
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
